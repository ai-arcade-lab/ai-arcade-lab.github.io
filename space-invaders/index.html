<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スペースインベーダー</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; font-family: 'Courier New', monospace; overflow: hidden; }
#gameCanvas { display: block; border: 2px solid #0f0; background: #000; cursor: crosshair; }
#hud { color: #0f0; font-size: 14px; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: #000; }
#touchControls { display: none; width: 100%; background: #000; padding: 8px 4px; }
.touch-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.touch-btn {
  flex: 1; height: 56px; background: rgba(0,255,0,0.1); border: 2px solid #0f0;
  color: #0f0; font-size: 22px; font-weight: bold; border-radius: 8px;
  touch-action: manipulation; user-select: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.touch-btn:active, .touch-btn.pressed { background: rgba(0,255,0,0.35); }
#fireBtn { flex: 2; background: rgba(255,80,0,0.13); border-color: #f50; color: #f50; }
#fireBtn:active, #fireBtn.pressed { background: rgba(255,80,0,0.35); }
#pauseTouchBtn { flex: none; width: 50px; font-size: 16px; }
#muteBtn { width: 44px; height: 28px; flex: none; font-size: 13px; padding: 0 6px; border-radius: 4px; touch-action: manipulation; }
@media (max-width: 520px) {
  #touchControls { display: block; }
  #hud { font-size: 12px; }
}
</style>
</head>
<body>
<div id="hud">
  <span id="scoreDisplay">SCORE: 0</span>
  <span id="waveDisplay">WAVE: 1</span>
  <span id="hiDisplay">HI: 0</span>
  <span id="livesDisplay">LIVES: ♥♥♥</span>
  <button id="muteBtn" class="touch-btn">🔊</button>
</div>
<canvas id="gameCanvas"></canvas>
<div id="touchControls">
  <div class="touch-row">
    <button class="touch-btn" id="leftBtn">◀</button>
    <button class="touch-btn" id="fireBtn">FIRE</button>
    <button class="touch-btn" id="rightBtn">▶</button>
    <button class="touch-btn" id="pauseTouchBtn">⏸</button>
  </div>
</div>

<script>
// ─── State constants ───────────────────────────────────────────────────────
const STATE_TITLE      = 'title';
const STATE_PLAYING    = 'playing';
const STATE_PAUSED     = 'paused';
const STATE_WAVE_CLEAR = 'wave_clear';
const STATE_GAME_OVER  = 'gameover';

// ─── Audio ────────────────────────────────────────────────────────────────
let audioCtx = null;
let muted = false;
let bgmTimeout = null;
let bgmActive = false;

function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, duration, vol = 0.3, startTime = 0) {
  if (muted) return;
  const ctx = getAudio();
  const t = ctx.currentTime + startTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.start(t);
  osc.stop(t + duration + 0.05);
}

function playShoot() {
  if (muted) return;
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'square';
  osc.frequency.setValueAtTime(800, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.15);
  gain.gain.setValueAtTime(0.2, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
  osc.start(ctx.currentTime);
  osc.stop(ctx.currentTime + 0.2);
}

function playExplosion() {
  if (muted) return;
  const ctx = getAudio();
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
  const src = ctx.createBufferSource();
  const gain = ctx.createGain();
  src.buffer = buf; src.connect(gain); gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0.4, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
  src.start(ctx.currentTime); src.stop(ctx.currentTime + 0.35);
}

function playEnemyShoot() {
  if (muted) return;
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(300, ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.15, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
  osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.25);
}

function playGameOver() {
  if (muted) return;
  const notes = [440, 370, 311, 261];
  notes.forEach((f, i) => playTone(f, 'sawtooth', 0.4, 0.3, i * 0.35));
}

function playWaveClear() {
  if (muted) return;
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => playTone(f, 'triangle', 0.3, 0.3, i * 0.2));
}

function playPlayerHit() {
  if (muted) return;
  const ctx = getAudio();
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 1.5);
  const src = ctx.createBufferSource();
  const gain = ctx.createGain();
  src.buffer = buf; src.connect(gain); gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0.6, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
  src.start(ctx.currentTime); src.stop(ctx.currentTime + 0.55);
}

function playUFOSound() {
  if (muted) return;
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(220, ctx.currentTime);
  osc.frequency.linearRampToValueAtTime(440, ctx.currentTime + 0.3);
  osc.frequency.linearRampToValueAtTime(220, ctx.currentTime + 0.6);
  gain.gain.setValueAtTime(0.12, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
  osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.65);
}

// Classic Space Invaders 4-note march: bum bum bum BUM
const BGM_NOTES = [
  [160, 'square', 0.07],
  [130, 'square', 0.07],
  [110, 'square', 0.07],
  [130, 'square', 0.1],
];
let bgmStep = 0;
let ufoSoundTimer = 0;

function startBGM() {
  if (bgmActive) return;
  bgmActive = true;
  function tick() {
    if (!bgmActive) return;
    const activeCount = enemies.filter(e => e.active).length;
    const ratio = Math.max(0.1, activeCount / (ROWS * COLS));
    // ×1.15 per wave: base interval speeds up with wave
    const waveSpeedFactor = Math.pow(0.92, wave - 1);
    const interval = Math.max(55, Math.round(420 * ratio * waveSpeedFactor));
    if (!muted) {
      const [freq, type, dur] = BGM_NOTES[bgmStep % BGM_NOTES.length];
      playTone(freq, type, dur, 0.22);
    }
    bgmStep++;
    bgmTimeout = setTimeout(tick, interval);
  }
  tick();
}

function stopBGM() {
  bgmActive = false;
  clearTimeout(bgmTimeout);
}

// ─── Canvas setup ──────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const BASE_W = 480;
const BASE_H = 520;
let scale = 1;

function resize() {
  const maxW = Math.min(window.innerWidth, 800);
  const maxH = window.innerHeight
    - document.getElementById('hud').offsetHeight
    - (window.innerWidth <= 520 ? 82 : 0);
  scale = Math.min(maxW / BASE_W, maxH / BASE_H, 1.5);
  canvas.width  = BASE_W * scale;
  canvas.height = BASE_H * scale;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
window.addEventListener('resize', resize);

// ─── Game State ────────────────────────────────────────────────────────────
let gameState = STATE_TITLE;
let score = 0;
let hiScore = parseInt(localStorage.getItem('si_hi') || '0');
let lives = 3;
let wave = 1;
let waveClearTimer = 0;

// Player
const player = { x: BASE_W / 2, y: BASE_H - 30, w: 30, h: 20, speed: 180 };

// Bullets
let playerBullet = null;
const enemyBullets = [];

// Enemies
const ROWS = 5, COLS = 11;
const ENEMY_TYPES = [
  { color: '#f55', points: 30, shape: 'A' },
  { color: '#5af', points: 20, shape: 'B' },
  { color: '#5af', points: 20, shape: 'B' },
  { color: '#5f5', points: 10, shape: 'C' },
  { color: '#5f5', points: 10, shape: 'C' },
];
let enemies = [];
let enemyDir = 1;
let enemyBaseSpeed = 30;
let enemyShootTimer = 0;
let enemyShootInterval = 1.5;
let enemyMoveTimer = 0;
let enemyMoveInterval = 0.5;

// Barriers
const BARRIER_COUNT = 4;
let barriers = [];

// UFO
let ufo = null;
let ufoTimer = 0;
let ufoInterval = 22;

// Stars
const stars = Array.from({ length: 60 }, () => ({
  x: Math.random() * BASE_W,
  y: Math.random() * BASE_H,
  r: Math.random() * 1.5 + 0.3,
  b: Math.random() * 0.7 + 0.3
}));

// Particles
const particles = [];
const scorePopups = [];

// Screen shake
let shakeX = 0, shakeY = 0, shakeDuration = 0, shakeMag = 0;

// Input
const keys = {};
let touchLeft = false, touchRight = false, touchFire = false;
let lastFirePressed = false;

// Timing
let lastTime = 0;
let invincTimer = 0;

// ─── Init ──────────────────────────────────────────────────────────────────
function initLevel() {
  enemies = [];
  const startX = 40;
  const startY = 60 + (wave - 1) * 3;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      enemies.push({
        x: startX + c * 36,
        y: startY + r * 28,
        w: 28, h: 20,
        row: r, col: c,
        type: ENEMY_TYPES[r],
        active: true,
        frame: 0,
        flashTimer: 0,
        dying: false
      });
    }
  }
  enemyDir = 1;
  // ×1.15 per wave for base speed
  enemyBaseSpeed = 20 * Math.pow(1.15, wave - 1);
  enemyMoveInterval = Math.max(0.12, 0.5 * Math.pow(0.9, wave - 1));
  enemyShootInterval = Math.max(0.5, 1.5 - (wave - 1) * 0.12);
  enemyShootTimer = 0;
  enemyMoveTimer = 0;
  playerBullet = null;
  enemyBullets.length = 0;
  particles.length = 0;
  scorePopups.length = 0;
  ufo = null;
  ufoTimer = 0;
  ufoInterval = Math.max(12, 22 - wave);
  ufoSoundTimer = 0;
  player.x = BASE_W / 2;
  invincTimer = 0;
  shakeDuration = 0;
  waveClearTimer = 0;
  initBarriers();
}

function initBarriers() {
  barriers = [];
  const bw = 40, bh = 28;
  const gap = (BASE_W - BARRIER_COUNT * bw) / (BARRIER_COUNT + 1);
  for (let i = 0; i < BARRIER_COUNT; i++) {
    const bx = gap + i * (bw + gap);
    const by = BASE_H - 90;
    const blocks = [];
    for (let row = 0; row < 5; row++) {
      for (let col = 0; col < 8; col++) {
        if (row >= 3 && (col < 2 || col > 5)) continue;
        if (row === 4 && (col < 2 || col > 5)) continue;
        blocks.push({ x: bx + col * 5, y: by + row * 5, w: 5, h: 5, hp: 4 });
      }
    }
    barriers.push(blocks);
  }
}

function startGame() {
  score = 0;
  lives = 3;
  wave = 1;
  lastFirePressed = true;
  gameState = STATE_PLAYING;
  initLevel();
  startBGM();
  getAudio().resume();
}

// ─── Particles ─────────────────────────────────────────────────────────────
function spawnParticles(x, y, count, color) {
  const available = 50 - particles.length;
  const n = Math.min(count, available);
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 80;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      w: 2 + Math.random() * 4,
      h: 2 + Math.random() * 3,
      life: 1,
      color
    });
  }
}

function addScorePopup(x, y, pts) {
  scorePopups.push({ x, y, pts, life: 1 });
}

function triggerShake(mag, dur) {
  shakeMag = mag;
  shakeDuration = dur;
}

// ─── Drawing ────────────────────────────────────────────────────────────────
function drawStars() {
  stars.forEach(s => {
    ctx.fillStyle = `rgba(255,255,255,${s.b})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawEnemy(e) {
  if (!e.active) return;
  const { x, y, w, h, type, frame, flashTimer } = e;
  ctx.fillStyle = flashTimer > 0 ? '#fff' : type.color;

  if (type.shape === 'A') {
    ctx.fillRect(x + 8, y, w - 16, 5);
    ctx.fillRect(x + 4, y + 5, w - 8, 5);
    ctx.fillRect(x, y + 10, w, 5);
    ctx.fillRect(x + 4, y + 15, 5, 5);
    ctx.fillRect(x + w - 9, y + 15, 5, 5);
    if (frame === 0) {
      ctx.fillRect(x, y + 8, 4, 3);
      ctx.fillRect(x + w - 4, y + 8, 4, 3);
    } else {
      ctx.fillRect(x - 4, y + 8, 4, 3);
      ctx.fillRect(x + w, y + 8, 4, 3);
    }
  } else if (type.shape === 'B') {
    ctx.beginPath();
    ctx.arc(x + w / 2, y + 8, 10, Math.PI, 0);
    ctx.fillRect(x + 2, y + 8, w - 4, 10);
    ctx.fill();
    ctx.fillRect(x, y + 8, 6, 6);
    ctx.fillRect(x + w - 6, y + 8, 6, 6);
    if (frame === 0) {
      ctx.fillRect(x - 2, y + 15, 5, 5);
      ctx.fillRect(x + 8, y + 15, 4, 5);
      ctx.fillRect(x + w - 13, y + 15, 4, 5);
      ctx.fillRect(x + w - 3, y + 15, 5, 5);
    } else {
      ctx.fillRect(x + 2, y + 15, 5, 5);
      ctx.fillRect(x + 10, y + 15, 4, 5);
      ctx.fillRect(x + w - 14, y + 15, 4, 5);
      ctx.fillRect(x + w - 7, y + 15, 5, 5);
    }
  } else {
    ctx.fillRect(x + 6, y, w - 12, 5);
    ctx.fillRect(x + 2, y + 5, w - 4, 10);
    ctx.fillRect(x, y + 5, 4, 8);
    ctx.fillRect(x + w - 4, y + 5, 4, 8);
    ctx.fillRect(x + 4, y + 15, 5, 5);
    ctx.fillRect(x + w - 9, y + 15, 5, 5);
    if (frame === 0) {
      ctx.fillRect(x, y + 12, 4, 4);
      ctx.fillRect(x + w - 4, y + 12, 4, 4);
    } else {
      ctx.fillRect(x - 3, y + 12, 4, 4);
      ctx.fillRect(x + w, y + 12, 4, 4);
    }
  }

  if (flashTimer <= 0) {
    ctx.fillStyle = '#000';
    ctx.fillRect(x + 8, y + 6, 4, 4);
    ctx.fillRect(x + w - 12, y + 6, 4, 4);
  }
}

function drawPlayer() {
  const { x, y, w, h } = player;
  if (invincTimer > 0 && Math.floor(invincTimer * 10) % 2 === 0) return;
  ctx.fillStyle = '#0f0';
  ctx.fillRect(x - w / 2 + 6, y + 8, w - 12, h - 8);
  ctx.fillRect(x - 3, y, 6, 12);
  ctx.fillRect(x - w / 2, y + 14, w, 6);
  ctx.fillRect(x - w / 2, y + h - 4, 8, 4);
  ctx.fillRect(x + w / 2 - 8, y + h - 4, 8, 4);
}

function drawBullet(b, color) {
  ctx.fillStyle = color;
  ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
}

function drawUFO() {
  if (!ufo) return;
  ctx.fillStyle = '#f0f';
  ctx.beginPath();
  ctx.ellipse(ufo.x, ufo.y + 6, 22, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c0c';
  ctx.beginPath();
  ctx.ellipse(ufo.x, ufo.y + 2, 12, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ufo.x - 6, ufo.y + 2, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(ufo.x + 6, ufo.y + 2, 2, 0, Math.PI * 2); ctx.fill();
}

const BARRIER_COLORS = ['', '#ff6600', '#ffcc00', '#88cc00', '#00ff44'];

function drawBarriers() {
  barriers.forEach(blocks => {
    blocks.forEach(b => {
      if (b.hp <= 0) return;
      ctx.fillStyle = BARRIER_COLORS[Math.min(b.hp, 4)];
      ctx.fillRect(b.x, b.y, b.w, b.h);
    });
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.w / 2, p.y - p.h / 2, p.w, p.h);
  });
  ctx.globalAlpha = 1;
}

function drawScorePopups() {
  scorePopups.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = '#ff0';
    ctx.font = '12px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText('+' + p.pts, p.x, p.y);
  });
  ctx.globalAlpha = 1;
}

function drawHUD() {
  document.getElementById('scoreDisplay').textContent = `SCORE: ${score}`;
  document.getElementById('waveDisplay').textContent  = `WAVE: ${wave}`;
  document.getElementById('hiDisplay').textContent    = `HI: ${hiScore}`;
  const hearts = '♥'.repeat(lives) + '♡'.repeat(Math.max(0, 3 - lives));
  document.getElementById('livesDisplay').textContent = `LIVES: ${hearts}`;
}

function drawGround() {
  ctx.fillStyle = '#0f0';
  ctx.fillRect(0, BASE_H - 8, BASE_W, 2);
}

function drawTitle() {
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 36px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText('SPACE INVADERS', BASE_W / 2, 120);

  ctx.font = '14px "Courier New"';
  ctx.fillStyle = '#aaa';
  ctx.fillText('SCORE TABLE', BASE_W / 2, 170);

  const types = [
    { y: 200, color: '#f55', label: '= 30 PTS', shape: 'A' },
    { y: 240, color: '#5af', label: '= 20 PTS', shape: 'B' },
    { y: 280, color: '#5f5', label: '= 10 PTS', shape: 'C' },
    { y: 320, color: '#f0f', label: '= ??? PTS', shape: 'UFO' },
  ];
  types.forEach(t => {
    if (t.shape === 'UFO') {
      ctx.fillStyle = '#f0f';
      ctx.beginPath(); ctx.ellipse(BASE_W / 2 - 64, t.y - 8, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
    } else {
      const dummy = { x: BASE_W / 2 - 80, y: t.y - 16, w: 28, h: 20, type: { color: t.color, shape: t.shape }, frame: 0, active: true, flashTimer: 0 };
      drawEnemy(dummy);
    }
    ctx.fillStyle = '#fff';
    ctx.font = '13px "Courier New"';
    ctx.textAlign = 'left';
    ctx.fillText(t.label, BASE_W / 2 - 30, t.y);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = Math.floor(Date.now() / 500) % 2 === 0 ? '#0f0' : '#070';
  ctx.font = '16px "Courier New"';
  ctx.fillText('PRESS SPACE / TAP TO START', BASE_W / 2, 375);

  ctx.fillStyle = '#888';
  ctx.font = '12px "Courier New"';
  ctx.fillText(`HI-SCORE: ${hiScore}`, BASE_W / 2, 405);

  ctx.fillStyle = '#555';
  ctx.font = '11px "Courier New"';
  ctx.fillText('PC: ←→ MOVE  SPACE SHOOT  P PAUSE  M MUTE', BASE_W / 2, 430);
  ctx.fillText('SP: TOUCH BUTTONS', BASE_W / 2, 448);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = '#f55';
  ctx.font = 'bold 40px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', BASE_W / 2, BASE_H / 2 - 40);
  ctx.fillStyle = '#fff';
  ctx.font = '20px "Courier New"';
  ctx.fillText(`SCORE: ${score}`, BASE_W / 2, BASE_H / 2 + 10);
  if (score >= hiScore && score > 0) {
    ctx.fillStyle = '#ff0';
    ctx.font = '14px "Courier New"';
    ctx.fillText('NEW HI-SCORE!', BASE_W / 2, BASE_H / 2 + 40);
  }
  ctx.fillStyle = '#aaa';
  ctx.font = '14px "Courier New"';
  ctx.fillText('PRESS SPACE / TAP TO RETRY', BASE_W / 2, BASE_H / 2 + 70);
}

function drawWaveClear() {
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, BASE_W, BASE_H);
  ctx.fillStyle = '#0ff';
  ctx.font = 'bold 36px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText('WAVE CLEAR!', BASE_W / 2, BASE_H / 2 - 30);
  ctx.fillStyle = '#ff0';
  ctx.font = '20px "Courier New"';
  ctx.fillText(`WAVE ${wave} COMPLETE`, BASE_W / 2, BASE_H / 2 + 15);
  ctx.fillStyle = '#888';
  ctx.font = '13px "Courier New"';
  const secs = Math.ceil(waveClearTimer);
  ctx.fillText(`NEXT WAVE IN ${secs}...`, BASE_W / 2, BASE_H / 2 + 50);
}

// ─── Collision helpers ──────────────────────────────────────────────────────
function bulletHitsRect(b, rx, ry, rw, rh) {
  return b.x > rx && b.x < rx + rw && b.y > ry && b.y < ry + rh;
}

function rectsOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

// ─── Update ─────────────────────────────────────────────────────────────────
function update(dt) {
  // WAVE_CLEAR: countdown then start next wave
  if (gameState === STATE_WAVE_CLEAR) {
    waveClearTimer -= dt;
    if (waveClearTimer <= 0) {
      wave++;
      gameState = STATE_PLAYING;
      initLevel();
      startBGM();
    }
    return;
  }

  if (gameState !== STATE_PLAYING) return;

  invincTimer = Math.max(0, invincTimer - dt);

  // Screen shake decay
  if (shakeDuration > 0) {
    shakeDuration -= dt;
    const t = Math.max(0, shakeDuration);
    shakeX = (Math.random() * 2 - 1) * shakeMag * t;
    shakeY = (Math.random() * 2 - 1) * shakeMag * t;
  } else {
    shakeX = 0; shakeY = 0;
  }

  // Player movement
  const fireDown  = keys[' '] || keys['x'] || keys['X'] || touchFire;
  const moveLeft  = keys['ArrowLeft']  || keys['a'] || keys['A'] || touchLeft;
  const moveRight = keys['ArrowRight'] || keys['d'] || keys['D'] || touchRight;

  if (moveLeft)  player.x = Math.max(player.w / 2, player.x - player.speed * dt);
  if (moveRight) player.x = Math.min(BASE_W - player.w / 2, player.x + player.speed * dt);

  if (fireDown && !lastFirePressed && !playerBullet) {
    playerBullet = { x: player.x, y: player.y, speed: 420 };
    playShoot();
  }
  lastFirePressed = fireDown;

  // Player bullet movement
  if (playerBullet) {
    playerBullet.y -= playerBullet.speed * dt;
    if (playerBullet.y < 0) playerBullet = null;
  }

  // Player bullet vs enemies
  if (playerBullet) {
    for (const e of enemies) {
      if (!e.active || e.dying) continue;
      if (bulletHitsRect(playerBullet, e.x, e.y, e.w, e.h)) {
        e.flashTimer = 0.08;
        e.dying = true;
        score += e.type.points;
        if (score > hiScore) hiScore = score;
        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, 10, e.type.color);
        addScorePopup(e.x + e.w / 2, e.y, e.type.points);
        playExplosion();
        playerBullet = null;
        break;
      }
    }
  }

  // Player bullet vs UFO
  if (playerBullet && ufo) {
    if (bulletHitsRect(playerBullet, ufo.x - 22, ufo.y, 44, 14)) {
      const pts = [50, 100, 150, 300][Math.floor(Math.random() * 4)];
      score += pts;
      if (score > hiScore) hiScore = score;
      spawnParticles(ufo.x, ufo.y + 7, 16, '#f0f');
      addScorePopup(ufo.x, ufo.y, pts);
      playExplosion();
      triggerShake(4, 0.3);
      ufo = null;
      playerBullet = null;
    }
  }

  // Player bullet vs barriers
  if (playerBullet) {
    outer: for (const blocks of barriers) {
      for (const b of blocks) {
        if (b.hp <= 0) continue;
        if (bulletHitsRect(playerBullet, b.x, b.y, b.w, b.h)) {
          b.hp--;
          playerBullet = null;
          break outer;
        }
      }
    }
  }

  // Enemy flash update: deactivate after flash
  for (const e of enemies) {
    if (e.flashTimer > 0) {
      e.flashTimer = Math.max(0, e.flashTimer - dt);
      if (e.flashTimer === 0 && e.dying) e.active = false;
    }
  }

  // Enemy movement with count-based speed scaling
  enemyMoveTimer += dt;
  const activeEnemies = enemies.filter(e => e.active && !e.dying);
  const enemyCount = activeEnemies.length;
  // Residual acceleration: faster as fewer enemies remain
  const countRatio = Math.max(0.05, enemyCount / (ROWS * COLS));
  const dynamicInterval = Math.max(0.04, enemyMoveInterval * countRatio);

  if (enemyMoveTimer >= dynamicInterval) {
    enemyMoveTimer = 0;
    const step = enemyBaseSpeed * dynamicInterval;

    let hitWall = false;
    for (const e of activeEnemies) {
      const nx = e.x + step * enemyDir;
      if (nx < 5 || nx + e.w > BASE_W - 5) { hitWall = true; break; }
    }

    if (hitWall) {
      enemyDir *= -1;
      for (const e of activeEnemies) { e.y += 12; e.frame ^= 1; }
      for (const e of activeEnemies) {
        if (e.y + e.h >= BASE_H - 30) { triggerGameOver(); return; }
      }
    } else {
      for (const e of activeEnemies) { e.x += step * enemyDir; e.frame ^= 1; }
    }
  }

  // Enemy shooting — only frontmost in each column
  enemyShootTimer += dt;
  if (enemyShootTimer >= enemyShootInterval && activeEnemies.length > 0 && enemyBullets.length < 4) {
    enemyShootTimer = 0;
    const cols = {};
    for (const e of activeEnemies) {
      if (!cols[e.col] || cols[e.col].y < e.y) cols[e.col] = e;
    }
    const shooters = Object.values(cols);
    const shooter = shooters[Math.floor(Math.random() * shooters.length)];
    enemyBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, speed: 140 + wave * 15 });
    playEnemyShoot();
  }

  // Enemy bullets
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.y += b.speed * dt;
    if (b.y > BASE_H) { enemyBullets.splice(i, 1); continue; }

    if (invincTimer <= 0 && rectsOverlap(b.x - 2, b.y - 6, 4, 12, player.x - 15, player.y, 30, 20)) {
      enemyBullets.splice(i, 1);
      playerHit();
      continue;
    }

    let hitBarrier = false;
    outer2: for (const blocks of barriers) {
      for (const blk of blocks) {
        if (blk.hp <= 0) continue;
        if (bulletHitsRect(b, blk.x, blk.y, blk.w, blk.h)) {
          blk.hp--;
          hitBarrier = true;
          break outer2;
        }
      }
    }
    if (hitBarrier) enemyBullets.splice(i, 1);
  }

  // UFO
  ufoTimer += dt;
  if (ufoTimer >= ufoInterval && !ufo) {
    ufoTimer = 0;
    ufo = { x: -30, y: 20, speed: 70, dir: 1 };
    if (Math.random() < 0.5) { ufo.x = BASE_W + 30; ufo.dir = -1; }
    ufoSoundTimer = 0;
  }
  if (ufo) {
    ufo.x += ufo.speed * ufo.dir * dt;
    ufoSoundTimer -= dt;
    if (ufoSoundTimer <= 0) { playUFOSound(); ufoSoundTimer = 0.65; }
    if (ufo.x < -40 || ufo.x > BASE_W + 40) ufo = null;
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt * 2;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Score popups
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const p = scorePopups[i];
    p.y -= 30 * dt;
    p.life -= dt * 1.5;
    if (p.life <= 0) scorePopups.splice(i, 1);
  }

  // Wave clear check
  if (activeEnemies.length === 0) {
    gameState = STATE_WAVE_CLEAR;
    waveClearTimer = 2.0;
    stopBGM();
    playWaveClear();
    triggerShake(3, 0.5);
    if (score > hiScore) { hiScore = score; localStorage.setItem('si_hi', hiScore); }
  }
}

function playerHit() {
  lives--;
  spawnParticles(player.x, player.y + 10, 14, '#0f0');
  playPlayerHit();
  triggerShake(5, 0.4);
  playerBullet = null;
  if (lives <= 0) {
    triggerGameOver();
  } else {
    invincTimer = 2.5;
    player.x = BASE_W / 2;
  }
}

function triggerGameOver() {
  gameState = STATE_GAME_OVER;
  stopBGM();
  playGameOver();
  triggerShake(6, 0.6);
  if (score > hiScore) { hiScore = score; localStorage.setItem('si_hi', hiScore); }
}

// ─── Main loop ──────────────────────────────────────────────────────────────
function frame(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;

  update(dt);

  ctx.clearRect(0, 0, BASE_W, BASE_H);
  ctx.save();
  ctx.translate(shakeX, shakeY);
  ctx.fillStyle = '#000';
  ctx.fillRect(-Math.abs(shakeX) - 5, -Math.abs(shakeY) - 5, BASE_W + 10, BASE_H + 10);
  drawStars();

  if (gameState === STATE_TITLE) {
    ctx.restore();
    drawTitle();
  } else {
    drawGround();
    drawBarriers();
    enemies.forEach(e => drawEnemy(e));
    if (playerBullet) drawBullet(playerBullet, '#0f0');
    enemyBullets.forEach(b => drawBullet(b, '#f55'));
    drawUFO();
    drawPlayer();
    drawParticles();
    drawScorePopups();
    drawHUD();
    ctx.restore();

    if (gameState === STATE_GAME_OVER) drawGameOver();
    if (gameState === STATE_WAVE_CLEAR) drawWaveClear();
    if (gameState === STATE_PAUSED) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 40px "Courier New"';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSED', BASE_W / 2, BASE_H / 2);
      ctx.fillStyle = '#aaa';
      ctx.font = '14px "Courier New"';
      ctx.fillText('PRESS P TO RESUME', BASE_W / 2, BASE_H / 2 + 40);
    }
  }

  requestAnimationFrame(frame);
}

// ─── Input ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (!audioCtx) getAudio();
  if (audioCtx) audioCtx.resume();

  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') togglePause();
  if (e.key === ' ') e.preventDefault();

  if ((e.key === ' ' || e.key === 'Enter') && (gameState === STATE_TITLE || gameState === STATE_GAME_OVER)) {
    startGame();
  }
});

document.addEventListener('keyup', e => { keys[e.key] = false; });

function toggleMute() {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇' : '🔊';
  if (!muted && bgmActive) { stopBGM(); startBGM(); }
}

function togglePause() {
  if (gameState === STATE_PLAYING) { gameState = STATE_PAUSED; stopBGM(); }
  else if (gameState === STATE_PAUSED) { gameState = STATE_PLAYING; startBGM(); }
}

document.getElementById('muteBtn').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (audioCtx) audioCtx.resume();
  toggleMute();
});

function bindTouchBtn(id, setter) {
  const btn = document.getElementById(id);
  if (!btn) return;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!audioCtx) getAudio();
    if (audioCtx) audioCtx.resume();
    setter(true);
    btn.classList.add('pressed');
    if (gameState === STATE_TITLE || gameState === STATE_GAME_OVER) startGame();
  });
  btn.addEventListener('pointerup',     e => { e.preventDefault(); setter(false); btn.classList.remove('pressed'); });
  btn.addEventListener('pointercancel', e => {                      setter(false); btn.classList.remove('pressed'); });
}

bindTouchBtn('leftBtn',  v => { touchLeft  = v; });
bindTouchBtn('rightBtn', v => { touchRight = v; });
bindTouchBtn('fireBtn',  v => { touchFire  = v; });

// Pause touch button
const pauseTouchBtn = document.getElementById('pauseTouchBtn');
pauseTouchBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (audioCtx) audioCtx.resume();
  togglePause();
  pauseTouchBtn.classList.add('pressed');
});
pauseTouchBtn.addEventListener('pointerup',     e => { e.preventDefault(); pauseTouchBtn.classList.remove('pressed'); });
pauseTouchBtn.addEventListener('pointercancel', e => { pauseTouchBtn.classList.remove('pressed'); });

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!audioCtx) getAudio();
  if (audioCtx) audioCtx.resume();
  if (gameState === STATE_TITLE || gameState === STATE_GAME_OVER) startGame();
});

// ─── Start ──────────────────────────────────────────────────────────────────
resize();
requestAnimationFrame(ts => { lastTime = ts; requestAnimationFrame(frame); });
</script>
</body>
